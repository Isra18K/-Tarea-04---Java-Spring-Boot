<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERROTEC - Spring Boot Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --azul-primario: #0e3b7c;
      --azul-claro: #0088cc;
      --fondo-gris: #f4f6f9;
      --borde: #e1e4e8;
      --texto: #2d3748;
      --rojo: #e53e3e;
      --verde: #38a169;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--fondo-gris); color: var(--texto); }

    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--borde);
      padding: 14px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo-icon { color: var(--azul-claro); font-size: 1.8rem; }
    .logo-text { font-size: 1.6rem; font-weight: 900; color: var(--azul-primario); }
    .logo-text span { color: var(--azul-claro); }

    .search-box {
      flex: 1; max-width: 600px; display: flex;
      border: 2px solid var(--azul-claro); border-radius: 4px; overflow: hidden;
    }
    .search-box input { flex: 1; padding: 9px 14px; border: none; outline: none; font-size: 0.95rem; }
    .search-box button { background: var(--azul-claro); border: none; color: white; padding: 0 18px; cursor: pointer; }

    .cart-btn-nav { position: relative; background: none; border: none; cursor: pointer; color: var(--azul-primario); font-size: 1.5rem; }
    .cart-badge { position: absolute; top: -6px; right: -10px; background: var(--rojo); color: white; font-size: 0.75rem; font-weight: bold; border-radius: 50%; padding: 2px 6px; }

    .main-container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
    .admin-card { background: white; border: 1px solid var(--borde); border-radius: 6px; padding: 18px 24px; margin-bottom: 25px; }
    .admin-card h3 { font-size: 1.1rem; color: var(--azul-primario); margin-bottom: 12px; }
    .admin-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) auto; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.8rem; font-weight: bold; color: #555; }
    .field input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; }
    
    .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    .btn-submit { background: var(--azul-claro); color: white; height: 35px; }
    .btn-cancel { background: #718096; color: white; height: 35px; margin-left: 5px; }

    .shop-layout { display: grid; grid-template-columns: 1fr 340px; gap: 25px; align-items: start; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .product-card { background: white; border: 1px solid var(--borde); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .product-img-wrapper { background: #fafafa; height: 110px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; color: #cbd5e0; }
    .product-cat { font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: #a0aec0; margin-top: 8px; }
    .product-name { font-size: 0.95rem; font-weight: 700; color: var(--azul-primario); margin: 4px 0 6px 0; min-height: 38px; }
    .product-price { font-size: 1.25rem; font-weight: 800; color: #1a202c; }
    .product-stock { font-size: 0.8rem; color: #718096; margin-bottom: 12px; }
    .product-stock.low { color: var(--rojo); font-weight: bold; }
    .card-actions { display: flex; gap: 6px; }
    .btn-add-cart { flex: 1; background: var(--azul-claro); color: white; border: none; padding: 7px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-edit-prod { background: #edf2f7; border: 1px solid var(--borde); color: #4a5568; padding: 7px 10px; border-radius: 4px; cursor: pointer; }

    .cart-card { background: white; border: 1px solid var(--borde); border-radius: 6px; padding: 20px; }
    .cart-card h3 { font-size: 1.15rem; color: var(--azul-primario); padding-bottom: 10px; border-bottom: 1px solid var(--borde); }
    .cart-items-list { max-height: 300px; overflow-y: auto; margin-top: 10px; }
    .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #edf2f7; font-size: 0.85rem; }
    .cart-total-val { font-size: 1.3rem; font-weight: 800; color: var(--azul-primario); display: flex; justify-content: space-between; margin: 15px 0; }
    .btn-checkout { width: 100%; background: var(--verde); color: white; padding: 10px; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

    #notif { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 6px; font-size: 0.9rem; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="logo-container" onclick="location.reload()">
      <i class="fa-solid fa-play logo-icon"></i>
      <div class="logo-text">FERRO<span>TEC</span> <small style="font-size: 0.8rem; color:#718096;">[Spring Boot]</small></div>
    </div>
    <div class="search-box">
      <input type="text" id="busqueda" placeholder="Buscar productos..." oninput="filtrar()">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <button class="cart-btn-nav" onclick="document.getElementById('seccion-carrito').scrollIntoView({behavior: 'smooth'})">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
  </header>

  <div class="main-container">

    <div class="admin-card">
      <h3 id="form-titulo">Gestión de Inventario (Spring Boot REST)</h3>
      <form id="form-producto" class="admin-form">
        <input type="hidden" id="prod-id">
        <div class="field">
          <label>Artículo</label>
          <input type="text" id="prod-nombre" required>
        </div>
        <div class="field">
          <label>Categoría</label>
          <input type="text" id="prod-categoria" required>
        </div>
        <div class="field">
          <label>Precio (Q)</label>
          <input type="number" id="prod-precio" step="0.01" min="0.01" required>
        </div>
        <div class="field">
          <label>Stock</label>
          <input type="number" id="prod-stock" min="0" required>
        </div>
        <div>
          <button type="submit" id="btn-guardar" class="btn btn-submit">Guardar</button>
          <button type="button" id="btn-cancelar" class="btn btn-cancel" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="shop-layout">
      <div>
        <h2 style="font-size: 1.3rem; margin-bottom: 15px; color: var(--azul-primario);">Catálogo de Productos</h2>
        <div class="products-grid" id="grid-productos"></div>
      </div>

      <div class="cart-card" id="seccion-carrito">
        <h3><i class="fa-solid fa-cart-shopping"></i> Carrito de Compras</h3>
        <div class="cart-items-list" id="carrito-lista">
          <p style="color: #a0aec0; text-align: center; padding: 20px 0;">Carrito vacío</p>
        </div>
        <div class="cart-total-val">
          <span>Total:</span>
          <span id="cart-total-precio">Q0.00</span>
        </div>
        <button class="btn-checkout" onclick="procesarCompra()">Procesar Compra</button>
      </div>
    </div>
  </div>

  <div id="notif"></div>

  <script>
    let productos = [];
    let carrito = [];

    const grid = document.getElementById('grid-productos');
    const form = document.getElementById('form-producto');
    const listaCarrito = document.getElementById('carrito-lista');
    const badgeCarrito = document.getElementById('cart-badge');
    const notif = document.getElementById('notif');

    function avisar(msg, esError = false) {
      notif.textContent = msg;
      notif.style.background = esError ? 'var(--rojo)' : '#2d3748';
      notif.style.display = 'block';
      setTimeout(() => notif.style.display = 'none', 3500);
    }

    async function cargarProductos() {
  try {
    const res = await fetch('/api/productos');
    
    if (!res.ok) {
      const errorTexto = await res.text();
      throw new Error(`Código ${res.status}: ${errorTexto}`);
    }

    const json = await res.json();
    productos = Array.isArray(json) ? json : (json.data || []);
    renderCatalogo(productos);
  } catch (e) {
    console.error('Detalle del error:', e);
    avisar('Error: ' + e.message, true);
  }
}

    function renderCatalogo(lista) {
      grid.innerHTML = '';
      lista.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <div class="product-img-wrapper"><i class="fa-solid fa-box"></i></div>
            <div class="product-cat">${p.categoria}</div>
            <div class="product-name">${p.nombre}</div>
            <div class="product-price">Q${p.precio.toFixed(2)}</div>
            <div class="product-stock ${p.stock <= 3 ? 'low' : ''}">Stock: ${p.stock}</div>
          </div>
          <div class="card-actions">
            <button class="btn-edit-prod" onclick="editarProducto(${p.id})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-add-cart" onclick="meterAlCarrito(${p.id})" ${p.stock === 0 ? 'disabled style="opacity:0.5;"' : ''}>
              ${p.stock > 0 ? '+ Agregar' : 'Agotado'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrar() {
      const q = document.getElementById('busqueda').value.toLowerCase();
      renderCatalogo(productos.filter(p => p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q)));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const datos = {
        nombre: document.getElementById('prod-nombre').value.trim(),
        categoria: document.getElementById('prod-categoria').value.trim(),
        precio: parseFloat(document.getElementById('prod-precio').value),
        stock: parseInt(document.getElementById('prod-stock').value, 10)
      };

      const url = id ? `/api/productos/${id}` : '/api/productos';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        const resJson = await res.json();
        if (!res.ok) throw new Error(resJson.error || 'Error en la petición');

        avisar(resJson.mensaje);
        cancelarEdicion();
        cargarProductos();
      } catch (err) {
        avisar(err.message, true);
      }
    });

    function editarProducto(id) {
      const p = productos.find(i => i.id === id);
      if (!p) return;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nombre').value = p.nombre;
      document.getElementById('prod-categoria').value = p.categoria;
      document.getElementById('prod-precio').value = p.precio;
      document.getElementById('prod-stock').value = p.stock;
      document.getElementById('form-titulo').textContent = `Modificar Producto: ${p.nombre}`;
      document.getElementById('btn-guardar').textContent = 'Actualizar';
      document.getElementById('btn-cancelar').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      form.reset();
      document.getElementById('prod-id').value = '';
      document.getElementById('form-titulo').textContent = 'Gestión de Inventario (Spring Boot REST)';
      document.getElementById('btn-guardar').textContent = 'Guardar';
      document.getElementById('btn-cancelar').style.display = 'none';
    }

    function meterAlCarrito(id) {
      const p = productos.find(i => i.id === id);
      const enCarro = carrito.find(i => i.id === id);
      const cantActual = enCarro ? enCarro.cantidad : 0;

      if (cantActual + 1 > p.stock) {
        avisar(`Stock máximo alcanzado para ${p.nombre}`, true);
        return;
      }

      if (enCarro) enCarro.cantidad++;
      else carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1 });

      actualizarCarrito();
    }

    function actualizarCarrito() {
      badgeCarrito.textContent = carrito.reduce((a, c) => a + c.cantidad, 0);
      if (carrito.length === 0) {
        listaCarrito.innerHTML = '<p style="color: #a0aec0; text-align: center; padding: 20px 0;">Carrito vacío</p>';
        document.getElementById('cart-total-precio').textContent = 'Q0.00';
        return;
      }
      listaCarrito.innerHTML = '';
      let total = 0;
      carrito.forEach(item => {
        const sub = item.precio * item.cantidad;
        total += sub;
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
          <div><strong>${item.nombre}</strong><br>${item.cantidad} x Q${item.precio.toFixed(2)}</div>
          <div><strong>Q${sub.toFixed(2)}</strong> <button onclick="quitar(${item.id})" style="border:none;background:none;color:red;cursor:pointer;">x</button></div>
        `;
        listaCarrito.appendChild(row);
      });
      document.getElementById('cart-total-precio').textContent = `Q${total.toFixed(2)}`;
    }

    function quitar(id) {
      carrito = carrito.filter(i => i.id !== id);
      actualizarCarrito();
    }

    async function procesarCompra() {
      if (carrito.length === 0) return avisar('El carrito está vacío', true);

      try {
        const payload = { items: carrito.map(i => ({ id: i.id, cantidad: i.cantidad })) };
        const res = await fetch('/api/ventas/carrito', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al procesar la venta');

        avisar(`¡Éxito! Venta procesada por Q${data.totalPagar.toFixed(2)}`);
        carrito = [];
        actualizarCarrito();
        cargarProductos();
      } catch (err) {
        avisar(err.message, true);
      }
    }

    cargarProductos();
  </script>
</body>
</html>
