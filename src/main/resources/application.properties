spring.application.name=ferreteria-springboot
server.port=8080

# Configuracion de Base de Datos H2 en memoria con persistencia en sesion
spring.datasource.url=jdbc:h2:mem:ferreteriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cargar data.sql al arrancar
spring.jpa.defer-datasource-initialization=true

# Forzar codificacion UTF-8
spring.sql.init.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true